<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1115;
    color: #eaeaea;
    padding: 20px;
}

/* Section titles */
h1 {
    margin-top: 30px;
    font-size: 22px;
}

/* Grid layout */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 10px;
}

/* Card */
.card {
    background: #151821;
    border: 1px solid #2a2f3a;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #3a4252;
}

/* Image */
.card img {
    width: 100%;
    border-radius: 6px;
}

/* Title */
.card p {
    margin: 10px 0 5px;
    color: #ccc;
}
</style>
</head>

<body>
<h1>🕹️ Our Games</h1>
<div class="grid">

    
<div class="card" onclick="openURL('https://puppy38.github.io/unbore-yourself/Super Stella/')">
<img src="./resources/superstella.png">
<p>Super Stella</p>
</div>

<div class="card" onclick="openURL('https://puppy38.github.io/playescapeeni/')">
<img src="./resources/eeni.png">
<p>Escape Eni</p>
</div>

<div class="card" onclick="openURL('https://puppy38.github.io/unbore-yourself/Five%20Nights%20At%20Eni%27s%20(4)/')">
<img src="./resources/fnae.png">
<p>Five Nights At Eni's</p>
</div>


<div class="card" onclick="openURL('https://puppy38.github.io/unbore-yourself/usc/')">
<img src="./resources/spcl.png">
<p>Ultimate Spark Clicker</p>
</div>

<div class="card" onclick="openURL('https://puppy38.github.io/unbore-yourself/mbox/')">
<img src="./resources/mbox.png">
<p>Move Box</p>
</div>
</div>


<h1>📱 Mobile Games</h1>
<div class="grid">

<div class="card" onclick="openURL('https://puppy38.github.io/escape-eni-mobile/')">
<img src="./resources/eeni.png">
<p>Escape Eni Mobile (v3.6)</p>
</div>

<div class="card" onclick="openURL('https://puppy38.github.io/Android/FNAE/')">
<img src="./resources/fnae.png">
<p>FNAE Mobile</p>
</div>

<div class="card" onclick="openURL('https://puppy38.github.io/Android/Move%20Box/')">
<img src="./resources/mbox.png">
<p>Move Box Mobile</p>
</div>

</div>

<h1>🎮 Other Games</h1>
<div class="grid">

<div class="card" onclick="openURL('https://geometrydash-pc.com/play/gdlite/')">
<img src="./resources/geomdash.png">
<p>Geometry Dash (Lite)</p>
</div>
</div>
    

<script>
function openURL(url) {
    window.open(url, "_blank");
}
</script>

</body>
</html>
